# Not used for the office installation. Do not create a Render service from this file.
# The office computer uses .env with the Supabase DATABASE_URL and DIRECT_URL, then npm start.
# This file does not change local startup unless someone deploys it.
services:
  - type: web
    name: cmh-cleaning-test
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate && npm run build && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: CMH_BIND
        value: 0.0.0.0
      - key: COOKIE_SECURE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
